<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOYO Match – Chauffeurs et propriétaires</title>
<style>
:root{--bg:#eaf0f1;--cd:#fff;--tx:#0e2a3b;--mu:#5d7482;--bd:#d5e0e4;--ac:#0e2a3b;--on:#fff;--yl:#f2b705;--gn:#1a9b5a;--rd:#c94a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a23;--cd:#12293a;--tx:#e8f1f4;--mu:#8fa8b5;--bd:#22404f;--ac:#f2b705;--on:#0b1a23}}
:root[data-theme="dark"]{--bg:#0b1a23;--cd:#12293a;--tx:#e8f1f4;--mu:#8fa8b5;--bd:#22404f;--ac:#f2b705;--on:#0b1a23}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:auto;min-height:100vh;padding-bottom:76px}
header{padding:16px 16px 8px}
h1{margin:0;font-size:26px;letter-spacing:-.5px;font-weight:800}
h2{font-size:18px;margin:18px 0 8px}
.sub{color:var(--mu);font-size:14px;margin:2px 0 0}
.roles{display:flex;gap:6px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:12px 16px}
.roles button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:700;padding:10px;border-radius:10px}
.roles button.on{background:var(--ac);color:var(--on)}
.bn{background:var(--yl);color:#0e2a3b;margin:0 16px 8px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600}
main{padding:0 16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-size:14px;padding:7px 12px;border-radius:99px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t{font-weight:700;font-size:17px}
.m{color:var(--mu);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin:6px 4px 0 0}
.sc{min-width:58px;text-align:center;font-weight:800;font-size:20px;color:var(--gn)}
.sc small{display:block;font-size:11px;color:var(--mu);font-weight:600}
.btn{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;background:var(--ac);color:var(--on)}
.btn.ok{background:var(--gn);color:#fff}
.btn.ghost{background:none;border:1px solid var(--bd);color:var(--tx)}
a.btn{display:block;text-align:center;text-decoration:none}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
.badge{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--gn);vertical-align:middle;margin-right:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;max-width:560px;margin:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;font-weight:700;padding:14px 4px}
nav button.on{color:var(--tx);box-shadow:inset 0 3px 0 var(--yl)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.s{opacity:1}
.emp{color:var(--mu);text-align:center;padding:30px 10px}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e2a3b"><link rel="icon" href="icon.svg"></head><body>
<header><h1>WOYO Match</h1><p class="sub">La bonne voiture pour le bon chauffeur, sur la durée.</p></header>
<div class="roles"><button id="r-ch" onclick="setRole('ch')">Je suis chauffeur</button><button id="r-pr" onclick="setRole('pr')">J'ai une voiture</button></div>
<div class="bn" id="bn"></div>
<main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script>
const CT=["Location-vente","Versement journalier","Salarié"],CM=["Cocody","Yopougon","Abobo","Marcory","Koumassi","Plateau","Bingerville"];
const V=[
{id:1,mod:"Toyota Corolla 2018",com:"Cocody",ct:"Location-vente",vs:18000,dur:12,pf:"Yango",own:"M. Traoré",nt:4.6,me:false},
{id:2,mod:"Hyundai Accent 2020",com:"Yopougon",ct:"Versement journalier",vs:15000,dur:6,pf:"Yango",own:"Mme Koné",nt:4.2,me:false},
{id:3,mod:"Kia Rio 2019",com:"Marcory",ct:"Salarié",vs:0,dur:6,pf:"Uber",own:"Flotte Sanogo",nt:4.8,me:false},
{id:4,mod:"Toyota Yaris 2017",com:"Abobo",ct:"Versement journalier",vs:12000,dur:3,pf:"Heetch",own:"M. Diallo",nt:3.9,me:false},
{id:5,mod:"Suzuki Dzire 2021",com:"Cocody",ct:"Versement journalier",vs:17000,dur:6,pf:"Yango",own:"Moi",nt:4.5,me:true},
{id:6,mod:"Toyota Corolla 2016",com:"Koumassi",ct:"Location-vente",vs:16000,dur:12,pf:"Yango",own:"Moi",nt:4.5,me:true}];
const D=[
{id:1,nom:"Kouassi A.",com:"Cocody",exp:4,nt:4.7,ct:"Location-vente",bud:20000,stab:"14 mois sur le dernier véhicule",tel:"2250700000001"},
{id:2,nom:"Yao B.",com:"Yopougon",exp:2,nt:4.1,ct:"Versement journalier",bud:15000,stab:"6 mois sur le dernier véhicule",tel:"2250700000002"},
{id:3,nom:"Bamba S.",com:"Cocody",exp:6,nt:4.9,ct:"Versement journalier",bud:18000,stab:"22 mois sur le dernier véhicule",tel:"2250700000003"},
{id:4,nom:"Konan D.",com:"Koumassi",exp:3,nt:4.3,ct:"Location-vente",bud:16500,stab:"9 mois sur le dernier véhicule",tel:"2250700000004"},
{id:5,nom:"Traoré M.",com:"Abobo",exp:1,nt:3.6,ct:"Salarié",bud:0,stab:"3 mois sur le dernier véhicule",tel:"2250700000005"}];
const S={role:"ch",tab:0,f:"Tous",veh:5,app:{},prop:{}};
const $=id=>document.getElementById(id),fc=n=>n.toLocaleString("fr-FR").replace(/\u202f/g," ")+" FCFA";
function score(v,d){let s=v.com==d.com?30:10;s+=v.ct==d.ct?30:10;s+=v.ct=="Salarié"||d.bud>=v.vs?20:d.bud>=v.vs*.85?10:0;return s+Math.round(d.nt/5*20)}
function toast(t){const e=$("toast");e.textContent=t;e.className="s";setTimeout(()=>e.className="",2200)}
function setRole(r){S.role=r;S.tab=0;render()}
function tab(i){S.tab=i;render()}
const me=D[0];
function render(){
 $("r-ch").className=S.role=="ch"?"on":"";$("r-pr").className=S.role=="pr"?"on":"";
 $("bn").textContent=S.role=="ch"?"Contrats de 3 à 12 mois minimum : une voiture stable, un revenu prévisible.":"Chauffeurs vérifiés et notés dans les deux sens : moins de changements, moins de risques.";
 const T=S.role=="ch"?["Offres","Candidatures","Mon profil"]:["Candidats","Publier","Mes voitures"];
 $("nav").innerHTML=T.map((t,i)=>`<button class="${S.tab==i?"on":""}" onclick="tab(${i})">${t}</button>`).join("");
 $("app").innerHTML=S.role=="ch"?[offers,apps,profile][S.tab]():[cands,publish,mine][S.tab]();
}
function offers(){
 const l=["Tous",...CT];
 let h=`<h2>Voitures disponibles</h2><div class="chips">${l.map(x=>`<button class="chip ${S.f==x?"on":""}" onclick="S.f='${x}';render()">${x}</button>`).join("")}</div>`;
 const list=V.filter(v=>!v.me&&(S.f=="Tous"||v.ct==S.f)).map(v=>({v,s:score(v,me)})).sort((a,b)=>b.s-a.s);
 if(!list.length)return h+`<p class="emp">Aucune offre pour ce filtre. Essayez « Tous ».</p>`;
 return h+list.map(({v,s})=>`<div class="card"><div class="row"><div><div class="t">${v.mod}</div><div class="m">${v.com} · ${v.own} · ★ ${v.nt}</div></div><div class="sc">${s}%<small>compatible</small></div></div>
 <span class="pill">${v.ct}</span><span class="pill">${v.vs?fc(v.vs)+"/jour":"Salaire fixe"}</span><span class="pill">Engagement ${v.dur} mois</span><span class="pill">${v.pf}</span>
 <button class="btn ${S.app[v.id]?"ok":""}" onclick="S.app[${v.id}]=1;toast('Candidature envoyée');render()">${S.app[v.id]?"Candidature envoyée":"Postuler"}</button></div>`).join("");
}
function apps(){
 const l=V.filter(v=>S.app[v.id]);
 if(!l.length)return `<h2>Mes candidatures</h2><p class="emp">Aucune candidature. Ouvrez « Offres » pour postuler.</p>`;
 return `<h2>Mes candidatures</h2>`+l.map(v=>`<div class="card"><div class="t">${v.mod}</div><div class="m">${v.com} · ${v.own}</div><span class="pill">En attente du propriétaire</span><span class="pill">Engagement ${v.dur} mois</span></div>`).join("");
}
function profile(){return `<h2>Mon profil</h2><div class="card"><div class="t"><span class="badge"></span>${me.nom}</div><div class="m">${me.com} · ${me.exp} ans d'expérience</div>
 <span class="pill">Statut vert · ★ ${me.nt}</span><span class="pill">${me.stab}</span><span class="pill">CNI et permis vérifiés</span><span class="pill">Préfère : ${me.ct}</span><span class="pill">Budget ${fc(me.bud)}/jour</span></div>
 <p class="m">Votre note vient des propriétaires et des passagers. Vous notez aussi les propriétaires : la note est réciproque.</p>`}
function cands(){
 const mv=V.filter(v=>v.me);if(!mv.some(v=>v.id==S.veh))S.veh=mv[0]?.id;
 const v=V.find(x=>x.id==S.veh);
 if(!v)return `<h2>Candidats</h2><p class="emp">Publiez d'abord une voiture.</p>`;
 let h=`<h2>Chauffeurs pour…</h2><div class="chips">${mv.map(x=>`<button class="chip ${x.id==S.veh?"on":""}" onclick="S.veh=${x.id};render()">${x.mod}</button>`).join("")}</div>`;
 return h+D.map(d=>({d,s:score(v,d)})).sort((a,b)=>b.s-a.s).map(({d,s})=>{const k=v.id+"-"+d.id;return `<div class="card"><div class="row"><div><div class="t">${d.nom}</div><div class="m">${d.com} · ${d.exp} ans · ★ ${d.nt}</div></div><div class="sc">${s}%<small>compatible</small></div></div>
 <span class="pill">${d.stab}</span><span class="pill">${d.ct}</span><span class="pill">Documents vérifiés</span>
 <button class="btn ${S.prop[k]?"ok":""}" onclick="S.prop['${k}']=1;toast('Essai de 7 jours proposé');render()">${S.prop[k]?"Essai proposé":"Proposer un essai de 7 jours"}</button>
 <a class="btn ghost" href="https://wa.me/${d.tel}" target="_blank" rel="noopener">Écrire sur WhatsApp</a></div>`}).join("");
}
function publish(){return `<h2>Publier une voiture</h2><div class="card">
 <label>Modèle et année</label><input id="f-m" placeholder="Toyota Corolla 2018">
 <label>Commune</label><select id="f-c">${CM.map(c=>`<option>${c}</option>`).join("")}</select>
 <label>Type de contrat</label><select id="f-t">${CT.map(c=>`<option>${c}</option>`).join("")}</select>
 <label>Versement journalier (FCFA)</label><input id="f-v" type="number" inputmode="numeric" placeholder="15000">
 <label>Engagement minimum (mois)</label><select id="f-d"><option>3</option><option>6</option><option>12</option></select>
 <button class="btn" onclick="pub()">Publier la voiture</button></div>`}
function pub(){const m=$("f-m").value.trim();if(!m){toast("Indiquez le modèle");return}
 const id=V.length+1;V.push({id,mod:m,com:$("f-c").value,ct:$("f-t").value,vs:+$("f-v").value||0,dur:+$("f-d").value,pf:"Yango",own:"Moi",nt:4.5,me:true});
 S.veh=id;S.tab=0;toast("Voiture publiée");render()}
function mine(){return `<h2>Mes voitures</h2>`+V.filter(v=>v.me).map(v=>`<div class="card"><div class="t">${v.mod}</div><div class="m">${v.com}</div><span class="pill">${v.ct}</span><span class="pill">${v.vs?fc(v.vs)+"/jour":"Salaire fixe"}</span><span class="pill">Engagement ${v.dur} mois</span></div>`).join("")}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
